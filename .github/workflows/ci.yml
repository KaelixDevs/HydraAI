name: Hydra build and tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native desktop
        run: ./scripts/build.ps1
      - name: Core, ML and rendered UI tests
        run: ./scripts/test.ps1
      - name: Install installer compiler on disposable CI runner
        run: choco install innosetup --yes --no-progress
      - name: Publish self-contained portable build and installer
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: hydra-windows-development
          path: |
            artifacts/HydraAI-Portable.zip
            artifacts/installer/HydraAI-Setup.exe
  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s hydra-ml/tests -v
