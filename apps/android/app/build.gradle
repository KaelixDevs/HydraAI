plugins { id 'com.android.application' }
def llamaDir = providers.gradleProperty('llamaDir').orElse('').get()
android {
    namespace 'dev.kaelix.hydra'
    compileSdk 36
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'dev.kaelix.hydra'
        minSdk 26
        targetSdk 36
        versionCode 200
        versionName '0.2.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DLLAMA_SOURCE_DIR=' + llamaDir, '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'; cppFlags '-std=c++17' } }
    }
    signingConfigs {
        release {
            if (System.getenv('HYDRA_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('HYDRA_ANDROID_KEYSTORE'))
                storePassword System.getenv('HYDRA_ANDROID_STORE_PASSWORD')
                keyAlias 'hydra'
                keyPassword System.getenv('HYDRA_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    sourceSets { main { assets.srcDirs += ['build/generated/starter'] } }
    androidResources { noCompress += ['gguf'] }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
